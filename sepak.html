<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>아시아 스포츠 페스티벌 - 세팍타크로</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="sepak.css" />
</head>
<body>
  <div class="crt-overlay"></div>
  <div class="top-right-controls">
    <button id="soundToggleBtn" class="icon-toggle-btn" type="button" aria-label="소리 켜기/끄기">🔊</button>
    <a href="index.html" class="icon-toggle-btn home-link-btn" aria-label="육상 100m로 이동">🏃</a>
  </div>

  <div class="game-wrap">
    <header class="scoreboard">
      <h1>🏐 아시아 스포츠 페스티벌 <span>세팍타크로</span></h1>
      <div class="scoreboard-info">
        <div class="timer" id="timer">60초</div>
        <div class="stats">
          <span class="stat score-stat">🥎 점수 <b id="scoreValue">0</b></span>
          <span class="stat combo-stat">🔥 콤보 <b id="comboValue">0</b></span>
        </div>
      </div>
    </header>

    <main class="court-stage">
      <div class="sky"></div>
      <div class="crowd" id="crowd"></div>
      <div id="comboPopup" class="combo-popup"></div>

      <div class="court">
        <div class="net">
          <div class="net-tape"></div>
        </div>

        <div class="zone-gauge">
          <div class="zone-band"></div>
          <div class="zone-marker" id="zoneMarker"></div>
        </div>

        <div class="player us" id="usPlayer">
          <div class="head"></div>
          <div class="body"></div>
          <div class="arm arm-left"></div>
          <div class="arm arm-right"></div>
          <div class="leg leg-left"></div>
          <div class="leg leg-right"></div>
        </div>

        <div class="player opponent" id="opponentPlayer">
          <div class="head"></div>
          <div class="body"></div>
          <div class="arm arm-left"></div>
          <div class="arm arm-right"></div>
          <div class="leg leg-left"></div>
          <div class="leg leg-right"></div>
        </div>

        <div class="ball" id="ball"></div>
      </div>

      <div class="court-floor">
        <div class="court-half court-half-left"></div>
        <div class="court-half court-half-right"></div>
      </div>
    </main>

    <footer class="controls">
      <button id="kickBtn" class="kick-btn" type="button">
        <span class="kick-icon">🦵</span>
        <span class="kick-text">차기</span>
        <span class="key-hint">SPACE</span>
      </button>
    </footer>
  </div>

  <!-- Start overlay -->
  <div id="startOverlay" class="overlay">
    <div class="overlay-card">
      <h2>🏐 세팍타크로</h2>
      <p>공이 네트를 넘어 우리 코트로 떨어져요.<br />공이 <b>초록색으로 빛날 때</b> "차기" 버튼(또는 스페이스바)을 눌러서 다시 넘겨보세요!</p>
      <p class="tip">타이밍을 놓쳐서 공이 바닥에 닿으면 콤보가 초기화돼요. 성공할수록 공이 점점 빨라져요. 60초 동안 최대한 많은 점수와 콤보를 쌓아보세요.</p>
      <button id="startBtn" class="primary-btn">시작하기</button>
    </div>
  </div>

  <!-- Result overlay -->
  <div id="resultOverlay" class="overlay hidden">
    <div class="overlay-card">
      <h2 id="resultTitle">⏱️ 타임 업!</h2>
      <div id="newRecordBanner" class="new-record-banner hidden">🏆 최고기록 경신!</div>
      <p class="result-stat"><span>이번 점수:</span> <b id="finalScore">0</b></p>
      <p class="result-stat"><span>이번 최고 콤보:</span> <b id="finalMaxCombo">0</b></p>
      <p class="result-stat best-score-row"><span>개인 최고 점수:</span> <b id="bestScoreValue">0</b></p>
      <div class="result-btn-row">
        <button id="restartBtn" class="primary-btn big-restart-btn">다시 하기</button>
        <button id="mainMenuBtn" class="secondary-btn">메인으로 돌아가기</button>
      </div>
    </div>
  </div>

  <script src="sepak.js"></script>
</body>
</html>
