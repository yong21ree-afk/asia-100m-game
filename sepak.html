<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>아시아 스포츠 페스티벌 - 세팍타크로</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="sepak.css" />
</head>
<body>
  <div class="crt-overlay"></div>
  <div class="top-right-controls">
    <button id="soundToggleBtn" class="icon-toggle-btn" type="button" aria-label="소리 켜기/끄기">🔊</button>
    <button id="langToggleBtn" class="icon-toggle-btn lang-toggle-btn" type="button" aria-label="언어 전환">EN</button>
    <a href="index.html" class="icon-toggle-btn home-link-btn" aria-label="육상 100m로 이동">🏃</a>
  </div>

  <div class="game-wrap">
    <header class="scoreboard">
      <h1><span data-i18n="h1Main">🏐 아시아 스포츠 페스티벌</span> <span data-i18n="h1Sub">세팍타크로</span></h1>
      <div class="scoreboard-info">
        <div class="timer" id="timer">60<span data-i18n="secondsUnit">초</span></div>
        <div class="stats">
          <span class="stat score-stat">🥎 <span data-i18n="scoreLabel">점수</span> <b id="scoreValue">0</b></span>
          <span class="stat combo-stat">🔥 <span data-i18n="comboLabel">콤보</span> <b id="comboValue">0</b></span>
        </div>
      </div>
    </header>

    <main class="court-stage">
      <div class="sky"></div>
      <div class="crowd" id="crowd"></div>
      <div id="comboPopup" class="combo-popup"></div>

      <div class="court">
        <div class="net">
          <div class="net-tape"></div>
        </div>

        <div class="landing-shadow" id="landingShadow"></div>

        <div class="zone-gauge" id="zoneGauge">
          <div class="zone-band"></div>
          <div class="zone-marker" id="zoneMarker"></div>
        </div>

        <div class="player us" id="usPlayer">
          <div class="head"></div>
          <div class="body"></div>
          <div class="arm arm-left"></div>
          <div class="arm arm-right"></div>
          <div class="leg leg-left"></div>
          <div class="leg leg-right"></div>
        </div>

        <div class="player opponent" id="opponentPlayer">
          <div class="head"></div>
          <div class="body"></div>
          <div class="arm arm-left"></div>
          <div class="arm arm-right"></div>
          <div class="leg leg-left"></div>
          <div class="leg leg-right"></div>
        </div>

        <div class="ball" id="ball"></div>
      </div>

      <div class="court-floor">
        <div class="court-half court-half-left"></div>
        <div class="court-half court-half-right"></div>
      </div>
    </main>

    <footer class="controls">
      <button id="moveLeftBtn" class="move-btn" type="button" aria-label="왼쪽으로 이동">◀</button>
      <div class="kick-wrap">
        <div class="power-meter"><div class="power-fill" id="powerFill"></div></div>
        <button id="kickBtn" class="kick-btn" type="button">
          <span class="kick-icon">🦵</span>
          <span class="kick-text" data-i18n="kickBtn">차기</span>
          <span class="key-hint">SPACE</span>
        </button>
      </div>
      <button id="moveRightBtn" class="move-btn" type="button" aria-label="오른쪽으로 이동">▶</button>
    </footer>
  </div>

  <!-- Start overlay -->
  <div id="startOverlay" class="overlay">
    <div class="overlay-card">
      <h2 data-i18n="startTitle">🏐 세팍타크로</h2>
      <p data-i18n="startInstruction">◀/▶ 버튼(또는 방향키)으로 움직여서 공 아래로 이동하고, 공이 <b>초록색으로 빛날 때</b> "차기" 버튼(또는 스페이스바)을 <b>누르고 있다가 떼면</b> 세기 조절해서 넘길 수 있어요!</p>
      <p class="tip" data-i18n="startTip">오래 누를수록 강하게 차서 점수가 더 올라가요. 타이밍을 놓치거나 공에서 멀리 있으면 콤보가 초기화돼요. 60초 동안 최대한 많은 점수와 콤보를 쌓아보세요.</p>
      <button id="startBtn" class="primary-btn" data-i18n="startBtn">시작하기</button>
    </div>
  </div>

  <!-- Result overlay -->
  <div id="resultOverlay" class="overlay hidden">
    <div class="overlay-card">
      <h2 id="resultTitle" data-i18n="resultTitle">⏱️ 타임 업!</h2>
      <div id="newRecordBanner" class="new-record-banner hidden" data-i18n="newRecordBanner">🏆 최고기록 경신!</div>
      <p class="result-stat"><span data-i18n="finalScoreLabel">이번 점수:</span> <b id="finalScore">0</b></p>
      <p class="result-stat"><span data-i18n="finalComboLabel">이번 최고 콤보:</span> <b id="finalMaxCombo">0</b></p>
      <p class="result-stat best-score-row"><span data-i18n="bestScoreLabel">개인 최고 점수:</span> <b id="bestScoreValue">0</b></p>
      <div class="result-btn-row">
        <button id="restartBtn" class="primary-btn big-restart-btn" data-i18n="restartBtn">다시 하기</button>
        <button id="mainMenuBtn" class="secondary-btn" data-i18n="mainMenuBtn">메인으로 돌아가기</button>
      </div>
    </div>
  </div>

  <script src="sepak.js"></script>
</body>
</html>
